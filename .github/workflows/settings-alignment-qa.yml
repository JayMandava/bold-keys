name: Settings alignment Android QA
'on':
  push:
    branches: [fix/settings-paragraph-alignment]
permissions:
  contents: read
concurrency:
  group: settings-alignment-qa
  cancel-in-progress: false
jobs:
  android:
    if: github.repository == 'JayMandava/bold-keys' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official SDK using preaccepted licenses
        run: |
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/source-commit.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1' 'platform-tools' 'emulator' 'system-images;android-33;default;x86_64' </dev/null
      - name: Test and lint exact source and build emulator variant
        run: |
          python3 -m unittest discover -s tests -p 'test_release_workflow.py' -v
          ./gradlew --no-daemon --max-workers=2 -PunsignedRelease=true -PtestAbi=x86_64 -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest lintDebug assembleDebug
      - name: Capture software-emulated settings without host permission changes
        timeout-minutes: 32
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name settings-qa --package 'system-images;android-33;default;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd settings-qa -no-window -no-audio -no-boot-anim -no-snapshot -accel off -gpu swiftshader -feature -Vulkan -memory 2048 -cores 2 > qa-artifacts/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          deadline=$((SECONDS + 1200))
          until [[ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; do
            kill -0 "$emulator_pid"
            if (( SECONDS >= deadline )); then echo "Software emulator boot timeout"; exit 1; fi
            sleep 10
          done
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell settings put system screen_off_timeout 1800000
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          timeout 10m python3 tools/qa/settings_alignment_capture.py
      - name: Upload one-day QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: settings-alignment-qa
          path: |
            qa-artifacts/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 1
          if-no-files-found: warn

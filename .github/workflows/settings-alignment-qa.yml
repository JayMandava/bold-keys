name: Settings alignment Android QA
'on':
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: settings-alignment-qa
  cancel-in-progress: true
jobs:
  android:
    if: github.repository == 'JayMandava/bold-keys' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official SDK using preaccepted licenses
        run: |
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/source-commit.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1' </dev/null
      - name: Test and lint exact source and build emulator variant
        run: |
          python3 -m unittest discover -s tests -p 'test_release_workflow.py' -v
          ./gradlew --no-daemon --max-workers=2 -PunsignedRelease=true -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug
          if [[ -f tools/qa/standardization/init.gradle ]]; then
            ./gradlew --no-daemon --max-workers=2 -I tools/qa/standardization/init.gradle -PunsignedRelease=true -Pkotlin.compiler.execution.strategy=in-process assembleDebugAndroidTest
          fi
      - name: Upload one-day QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: settings-alignment-qa
          path: |
            qa-artifacts/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 1
          if-no-files-found: warn

name: Protected Android release
run-name: '${{ inputs.operation }} ${{ inputs.version }} at ${{ inputs.commit_sha }}'

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate signs and verifies only; publish creates a NEW release
        type: choice
        options: [validate, publish]
        default: validate
        required: true
      version:
        description: Exact stable source version (X.Y.Z)
        type: string
        required: true
      commit_sha:
        description: Full reviewed main commit SHA (40 lowercase hex characters)
        type: string
        required: true

permissions: {}
concurrency:
  group: bold-keys-production-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version }}
  COMMIT_SHA: ${{ inputs.commit_sha }}
  OPERATION: ${{ inputs.operation }}

jobs:
  validate_build:
    if: github.repository == 'JayMandava/bold-keys' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      version_code: ${{ steps.preflight.outputs.version_code }}
      manifest_sha: ${{ steps.prepare.outputs.manifest_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Check source, protected environment and release intent
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/release.py preflight --version "$VERSION" --commit "$COMMIT_SHA" --operation "$OPERATION"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android tools without accepting new licenses
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1' </dev/null
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Test release tooling
        run: python3 -m unittest discover -s tests -p 'test_release_workflow.py' -v
      - name: Verify pinned prediction and dictionary data
        run: python3 -m unittest discover -s tests -p 'test_prediction_data.py' -v
      - name: Test, lint and build without signing credentials
        run: ./gradlew --no-daemon --max-workers=4 -PunsignedRelease=true testReleaseUnitTest lintRelease assembleRelease
      - name: Verify unsigned arm64 candidate and provenance
        id: prepare
        env:
          VERSION_CODE: ${{ steps.preflight.outputs.version_code }}
        run: |
          mkdir candidate
          cp app/build/outputs/apk/release/app-release-unsigned.apk candidate/unsigned.apk
          cp "docs/releases/$VERSION.md" candidate/release-notes.md
          python3 tools/release/release.py prepare --version "$VERSION" --commit "$COMMIT_SHA" --code "$VERSION_CODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: unsigned-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/unsigned.apk
            candidate/candidate.json
            candidate/release-notes.md
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    needs: validate_build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-release
    permissions:
      contents: read
      actions: read
    outputs:
      manifest_sha: ${{ steps.prepare.outputs.manifest_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      VERSION_CODE: ${{ needs.validate_build.outputs.version_code }}
      MANIFEST_SHA: ${{ needs.validate_build.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck main, environment and publication intent after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/release.py preflight --version "$VERSION" --commit "$COMMIT_SHA" --operation "$OPERATION"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare verification tools before secrets are available
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0' </dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate_build.outputs.artifact_id }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error
      - name: Verify exact unsigned artifact before accessing signing credentials
        run: python3 tools/release/release.py verify --version "$VERSION" --commit "$COMMIT_SHA" --code "$VERSION_CODE" --manifest-sha "$MANIFEST_SHA"
      - name: Sign with existing production key (no build code, no fallback)
        env:
          BOLD_RELEASE_KEYSTORE_BASE64: ${{ secrets.BOLD_RELEASE_KEYSTORE_BASE64 }}
          BOLD_RELEASE_STORE_PASSWORD: ${{ secrets.BOLD_RELEASE_STORE_PASSWORD }}
          BOLD_RELEASE_KEY_ALIAS: ${{ secrets.BOLD_RELEASE_KEY_ALIAS }}
          BOLD_RELEASE_KEY_PASSWORD: ${{ secrets.BOLD_RELEASE_KEY_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          key_dir="$RUNNER_TEMP/bold-release-key"
          mkdir -m 700 "$key_dir"
          trap 'rm -rf -- "$key_dir"' EXIT
          for name in BOLD_RELEASE_KEYSTORE_BASE64 BOLD_RELEASE_STORE_PASSWORD BOLD_RELEASE_KEY_ALIAS BOLD_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo 'A required environment signing secret is missing; refusing to sign.' >&2
              exit 1
            fi
          done
          if [[ "${BOLD_RELEASE_KEY_ALIAS,,}" == androiddebugkey ]]; then
            echo 'Debug key alias forbidden.' >&2
            exit 1
          fi
          if ! printf '%s' "$BOLD_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_dir/release.keystore" 2>/dev/null; then
            echo 'Invalid encoded signing secret.' >&2
            exit 1
          fi
          test -s "$key_dir/release.keystore"
          mkdir signed
          cp candidate/release-notes.md signed/release-notes.md
          # Passwords remain in the process environment, never command arguments or log output.
          if ! "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$key_dir/release.keystore" \
            --ks-key-alias "$BOLD_RELEASE_KEY_ALIAS" \
            --ks-pass env:BOLD_RELEASE_STORE_PASSWORD \
            --key-pass env:BOLD_RELEASE_KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false \
            --out "signed/bold-keys-$VERSION.apk" candidate/unsigned.apk > "$key_dir/signing.log" 2>&1; then
            echo 'Production signing failed; confidential diagnostics discarded. No artifact will be uploaded.' >&2
            exit 1
          fi
      - name: Verify production certificate, version, ABI, debug flag and checksum
        id: prepare
        run: python3 tools/release/release.py prepare --signed --directory signed --version "$VERSION" --commit "$COMMIT_SHA" --code "$VERSION_CODE"
      - name: Remove any temporary signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/bold-release-key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: verified-production-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            signed/bold-keys-${{ inputs.version }}.apk
            signed/SHA256SUMS-${{ inputs.version }}.txt
            signed/candidate.json
            signed/release-notes.md
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Record validation result
        run: |
          echo 'Production-signed APK and checksum verified. Validation mode makes no Git tag or release changes.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: inputs.operation == 'publish'
    needs: [validate_build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      VERSION_CODE: ${{ needs.validate_build.outputs.version_code }}
      MANIFEST_SHA: ${{ needs.sign.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare verification tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0' </dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          path: signed
          merge-multiple: true
          digest-mismatch: error
      - name: Reverify and create new tag/draft/assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/release.py publish --signed --directory signed --version "$VERSION" --commit "$COMMIT_SHA" --code "$VERSION_CODE" --manifest-sha "$MANIFEST_SHA"

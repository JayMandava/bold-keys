name: Heritage themes Android emulator QA second run
'on':
  push:
    branches: [qa/heritage-themes-20261112-2]
permissions:
  contents: read
concurrency:
  group: heritage-themes-20261112-2
  cancel-in-progress: false
jobs:
  android:
    if: github.repository == 'JayMandava/bold-keys' && github.event.repository.private == false && github.actor == 'JayMandava' && github.run_attempt == 1 && github.event.created == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision official tools and check device baseline
        run: |
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/source-commit.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acl
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' </dev/null
          python3 tools/qa/heritage/kvm_access.py check
      - name: Test lint and build before the one device grant
        run: |
          python3 -m unittest discover -s tests -p 'test_release_workflow.py' -v
          ./gradlew --no-daemon --max-workers=2 -PunsignedRelease=true -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug
          ./gradlew --no-daemon --max-workers=2 -I tools/qa/heritage/init.gradle -PunsignedRelease=true -Pkotlin.compiler.execution.strategy=in-process assembleDebug assembleDebugAndroidTest
      - name: One approved accelerated capture and exact permission restoration
        timeout-minutes: 40
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_SERIAL=emulator-5554
          export ANDROID_AVD_HOME="$RUNNER_TEMP/settings-qa-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          cleanup() {
            result=$?
            trap - EXIT
            python3 tools/qa/heritage/kvm_access.py cleanup || exit 1
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name settings-qa-kvm --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
          python3 tools/qa/heritage/kvm_access.py grant
          "$ANDROID_HOME/emulator/emulator" -accel-check > qa-artifacts/acceleration.txt
          "$ANDROID_HOME/emulator/emulator" -avd settings-qa-kvm -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -accel on -gpu swiftshader -feature -Vulkan -camera-back none -camera-front none -memory 3072 -cores 2 > qa-artifacts/emulator.log 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > "$RUNNER_TEMP/settings-qa-kvm-access/emulator.pid"
          deadline=$((SECONDS + 600))
          until [[ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; do
            kill -0 "$emulator_pid"
            if (( SECONDS >= deadline )); then echo "Accelerated emulator boot timeout"; exit 1; fi
            sleep 5
          done
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell settings put system screen_off_timeout 1800000
          [[ "$(adb shell id -u | tr -d '\r')" == 2000 ]]
          adb shell getprop ro.product.cpu.abilist | grep arm64-v8a
          timeout 30m bash tools/qa/heritage/run.sh
      - name: Always restore and verify original KVM permissions
        if: always()
        run: python3 tools/qa/heritage/kvm_access.py cleanup
      - name: Upload one-day QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: heritage-themes-qa
          path: |
            qa-artifacts/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 1
          if-no-files-found: warn

name: Second approved accelerated colour QA
run-name: 'Second approved one-job colour QA at ${{ github.sha }}'

# One action-time approval, one initial branch-creation job. Never a release trigger.
'on':
  push:
    branches: [qa/iconic-colours-kvm-20261027-2]

permissions:
  contents: read

concurrency:
  group: approved-colour-kvm-20261027-2
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  approved_android_ui:
    if: github.repository == 'JayMandava/bold-keys' && github.event.repository.private == false && github.actor == 'JayMandava' && github.ref == 'refs/heads/qa/iconic-colours-kvm-20261027-2' && github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Check exact ordinary device baseline without granting access
        run: |
          mkdir -p qa-artifacts
          python3 tools/qa/approved-kvm-access.py check
          id > qa-artifacts/runner-identity.txt
          git rev-parse HEAD > qa-artifacts/source-commit.txt
          git rev-parse HEAD:app > qa-artifacts/app-tree.txt
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official tools with preaccepted licenses only
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' \
            'ndk;27.0.12077973' 'cmake;3.22.1' 'platform-tools' 'emulator' \
            'system-images;android-35;google_apis;x86_64' </dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed > qa-artifacts/sdk-packages.txt
      - name: Validate and build unchanged ARM64 product before any access grant
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_*workflow.py' -v 2>&1 | tee qa-artifacts/workflow-tests.txt
          ./gradlew --no-daemon --max-workers=2 -PunsignedRelease=true \
            -Pkotlin.compiler.execution.strategy=in-process \
            testReleaseUnitTest testDebugUnitTest lintRelease lintDebug \
            assembleRelease assembleDebug assembleDebugAndroidTest 2>&1 | tee qa-artifacts/build.txt
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > qa-artifacts/APK-SHA256SUMS.txt
      - name: Use the one approved runner-only ACL and run real Android gates
        timeout-minutes: 32
        run: |
          cleanup() {
            result=$?
            trap - EXIT
            python3 tools/qa/approved-kvm-access.py cleanup || exit 1
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 tools/qa/approved-kvm-access.py grant
          tools/qa/run-approved-kvm-ui.sh
      - name: Always remove grant and verify the original device ACL
        if: always()
        run: |
          if [[ -f tools/qa/approved-kvm-access.py ]]; then
            python3 tools/qa/approved-kvm-access.py cleanup
          else
            echo 'Checkout unavailable; no grant script could have executed.'
          fi
      - name: Upload bounded evidence including ACL cleanup (not a release)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-colour-ui-${{ github.sha }}-${{ github.run_id }}
          path: |
            qa-artifacts/
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-*.html
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 1
          compression-level: 1
          if-no-files-found: warn

name: BLOCKED pending exact production and private-delivery review - one-time PEPK export
run-name: 'PEPK export review at ${{ inputs.commit_sha }}'

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full reviewed current-main SHA; missing runtime pins/review/private delivery blocks all signing inputs
        type: string
        required: true
      delivery_cutoff_at:
        description: Owner-chosen UTC operational cutoff within next24h; not credential expiry; NEVER paste token
        type: string
        required: true

permissions: {}
concurrency:
  group: bold-keys-production-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  COMMIT_SHA: ${{ inputs.commit_sha }}

jobs:
  preflight:
    if: github.repository == 'JayMandava/bold-keys' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check reviewed image and manifest before metadata-token injection
        run: /usr/bin/python3 tools/release/pepk_provision.py --check-host
      - name: Check exact main, existing owner gate, private delivery and reviewed pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/pepk_preflight.py --commit "$COMMIT_SHA"

  prepare_public:
    needs: preflight
    if: github.repository == 'JayMandava/bold-keys' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact reviewed image and installer manifest before provisioning
        run: /usr/bin/python3 tools/release/pepk_provision.py --check-host
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          java-package: jdk
          architecture: x64
          force-download: true
          verify-signature: true
          cache-jdk: false
          overwrite-settings: false
          problem-matcher: false
      - name: Install immutable public Python and wheels and compare the installed JDK archive
        id: runtime
        run: |
          /usr/bin/python3 tools/release/pepk_runtime.py \
            --root "$RUNNER_TEMP/bold-pepk-runtime" --java-home "$JAVA_HOME"
      - name: Enforce staged runtime image tree native and derived-recipe pins
        env:
          PEPK_CANDIDATE_PYTHON_HOME: ${{ steps.runtime.outputs.python_home }}
          PYTHONHOME: ${{ steps.runtime.outputs.python_home }}
          LD_LIBRARY_PATH: ${{ steps.runtime.outputs.python_home }}/lib
          PYTHONDONTWRITEBYTECODE: '1'
        run: '"${{ steps.runtime.outputs.python }}" tools/release/pepk_provision.py --verify-runtime --public-runtime-diagnostics'
      - name: Fetch hash-pinned official source without redirects
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/bold-pepk-public"
          curl --fail --show-error --proto '=https' --tlsv1.2 --max-time 120 \
            'https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk-src.jar' \
            -o "$RUNNER_TEMP/bold-pepk-public/pepk-src.jar"
          python3 tools/release/pepk_public.py --source "$RUNNER_TEMP/bold-pepk-public/pepk-src.jar"
      - name: Rebuild twice verify all pins and prepare public recipient notices and UTF-8 console proof
        env:
          PEPK_CANDIDATE_PYTHON_HOME: ${{ steps.runtime.outputs.python_home }}
          PYTHONHOME: ${{ steps.runtime.outputs.python_home }}
          LD_LIBRARY_PATH: ${{ steps.runtime.outputs.python_home }}/lib
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "${{ steps.runtime.outputs.python }}" tools/release/pepk_stage.py --commit "$COMMIT_SHA" \
            --source "$RUNNER_TEMP/bold-pepk-public/pepk-src.jar" \
            --build-root "$RUNNER_TEMP/bold-pepk-public/build" \
            --payload "$RUNNER_TEMP/bold-pepk-public/payload"
      # No public Actions tool/source artifact. Protected job rebuilds the same pinned inputs.
      - name: Remove public build and input copies
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/bold-pepk-public" "$RUNNER_TEMP/bold-pepk-runtime"

  export:
    needs: prepare_public
    if: github.repository == 'JayMandava/bold-keys' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck exact main owner policy private delivery and pins after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/pepk_preflight.py --commit "$COMMIT_SHA"
      - name: Check exact reviewed image and installer manifest before provisioning
        run: /usr/bin/python3 tools/release/pepk_provision.py --check-host
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          java-package: jdk
          architecture: x64
          force-download: true
          verify-signature: true
          cache-jdk: false
          overwrite-settings: false
          problem-matcher: false
      - name: Install immutable public Python and wheels and compare the installed JDK archive
        id: runtime
        run: |
          /usr/bin/python3 tools/release/pepk_runtime.py \
            --root "$RUNNER_TEMP/bold-pepk-runtime" --java-home "$JAVA_HOME"
      - name: Enforce staged runtime image tree native and derived-recipe pins
        env:
          PEPK_CANDIDATE_PYTHON_HOME: ${{ steps.runtime.outputs.python_home }}
          PYTHONHOME: ${{ steps.runtime.outputs.python_home }}
          LD_LIBRARY_PATH: ${{ steps.runtime.outputs.python_home }}/lib
          PYTHONDONTWRITEBYTECODE: '1'
        run: '"${{ steps.runtime.outputs.python }}" tools/release/pepk_provision.py --verify-runtime'
      - name: Rebuild pinned public tool locally before any signing or delivery token injection
        env:
          PEPK_CANDIDATE_PYTHON_HOME: ${{ steps.runtime.outputs.python_home }}
          PYTHONHOME: ${{ steps.runtime.outputs.python_home }}
          LD_LIBRARY_PATH: ${{ steps.runtime.outputs.python_home }}/lib
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/bold-pepk-public"
          curl --fail --show-error --proto '=https' --tlsv1.2 --max-time 120 \
            'https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk-src.jar' \
            -o "$RUNNER_TEMP/bold-pepk-public/pepk-src.jar"
          "${{ steps.runtime.outputs.python }}" tools/release/pepk_stage.py --commit "$COMMIT_SHA" \
            --source "$RUNNER_TEMP/bold-pepk-public/pepk-src.jar" \
            --build-root "$RUNNER_TEMP/bold-pepk-public/build" \
            --payload "$RUNNER_TEMP/bold-pepk-verified-inputs"
      - name: Verify fixed private destination and operational cutoff before signing inputs
        id: delivery
        env:
          PEPK_CANDIDATE_PYTHON_HOME: ${{ steps.runtime.outputs.python_home }}
          PYTHONHOME: ${{ steps.runtime.outputs.python_home }}
          LD_LIBRARY_PATH: ${{ steps.runtime.outputs.python_home }}/lib
          PYTHONDONTWRITEBYTECODE: '1'
          BOLD_PEPK_DELIVERY_TOKEN: ${{ secrets.BOLD_PEPK_DELIVERY_TOKEN }}
          DELIVERY_CUTOFF: ${{ inputs.delivery_cutoff_at }}
        run: |
          set +x
          "${{ steps.runtime.outputs.python }}" tools/release/pepk_provision.py --verify-runtime
          "${{ steps.runtime.outputs.python }}" tools/release/pepk_delivery.py --commit "$COMMIT_SHA" \
            --cutoff "$DELIVERY_CUTOFF" --proof "$RUNNER_TEMP/bold-pepk-delivery-proof.json"
      - name: Recheck current main and existing owner controls immediately before signing step
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/pepk_preflight.py --commit "$COMMIT_SHA"
      - name: Export only encrypted existing key with reviewed bounded PTY controller
        env:
          PEPK_CANDIDATE_PYTHON_HOME: ${{ steps.runtime.outputs.python_home }}
          PYTHONHOME: ${{ steps.runtime.outputs.python_home }}
          LD_LIBRARY_PATH: ${{ steps.runtime.outputs.python_home }}/lib
          PYTHONDONTWRITEBYTECODE: '1'
          PRIVATE_DELIVERY_CHECKED: ${{ steps.delivery.outputs.verified }}
          BOLD_RELEASE_KEYSTORE_BASE64: ${{ secrets.BOLD_RELEASE_KEYSTORE_BASE64 }}
          BOLD_RELEASE_STORE_PASSWORD: ${{ secrets.BOLD_RELEASE_STORE_PASSWORD }}
          BOLD_RELEASE_KEY_ALIAS: ${{ secrets.BOLD_RELEASE_KEY_ALIAS }}
          BOLD_RELEASE_KEY_PASSWORD: ${{ secrets.BOLD_RELEASE_KEY_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          trap 'rm -rf -- "$RUNNER_TEMP"/bold-pepk-private-*' EXIT HUP INT TERM
          "${{ steps.runtime.outputs.python }}" tools/release/pepk_provision.py --verify-runtime
          "${{ steps.runtime.outputs.python }}" tools/release/pepk_export.py --commit "$COMMIT_SHA" \
            --payload "$RUNNER_TEMP/bold-pepk-verified-inputs" \
            --output "$RUNNER_TEMP/bold-pepk-export-artifact"
      - name: Reverify exact encrypted-only final allowlist without signing credentials
        env:
          PEPK_CANDIDATE_PYTHON_HOME: ${{ steps.runtime.outputs.python_home }}
          PYTHONHOME: ${{ steps.runtime.outputs.python_home }}
          LD_LIBRARY_PATH: ${{ steps.runtime.outputs.python_home }}/lib
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "${{ steps.runtime.outputs.python }}" tools/release/pepk_export.py --verify-output --commit "$COMMIT_SHA" \
            --payload "$RUNNER_TEMP/bold-pepk-verified-inputs" \
            --output "$RUNNER_TEMP/bold-pepk-export-artifact"
      - name: Deliver only encrypted ZIP and public certificate to fixed verified private repository
        env:
          PEPK_CANDIDATE_PYTHON_HOME: ${{ steps.runtime.outputs.python_home }}
          PYTHONHOME: ${{ steps.runtime.outputs.python_home }}
          LD_LIBRARY_PATH: ${{ steps.runtime.outputs.python_home }}/lib
          PYTHONDONTWRITEBYTECODE: '1'
          BOLD_PEPK_DELIVERY_TOKEN: ${{ secrets.BOLD_PEPK_DELIVERY_TOKEN }}
          DELIVERY_CUTOFF: ${{ inputs.delivery_cutoff_at }}
        run: |
          set +x
          "${{ steps.runtime.outputs.python }}" tools/release/pepk_provision.py --verify-runtime
          "${{ steps.runtime.outputs.python }}" tools/release/pepk_delivery.py --deliver --commit "$COMMIT_SHA" \
            --cutoff "$DELIVERY_CUTOFF" --proof "$RUNNER_TEMP/bold-pepk-delivery-proof.json" \
            --payload "$RUNNER_TEMP/bold-pepk-verified-inputs" \
            --output "$RUNNER_TEMP/bold-pepk-export-artifact"
      - name: Remove private temporary material verified inputs and local encrypted copies
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP"/bold-pepk-private-* \
            "$RUNNER_TEMP/bold-pepk-export-artifact" "$RUNNER_TEMP/bold-pepk-verified-inputs" \
            "$RUNNER_TEMP/bold-pepk-public" "$RUNNER_TEMP/bold-pepk-delivery-proof.json" \
            "$RUNNER_TEMP/private-delivery-receipt.json" "$RUNNER_TEMP/bold-pepk-runtime"
